<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurante POS - Sistema Integral</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #ticket-imprimible, #ticket-imprimible * { visibility: visible; }
      #ticket-imprimible { position: absolute; left: 0; top: 0; width: 80mm; }
    }
  </style>
</head>
<body class="bg-[#181412] text-[#f5efe6] min-h-screen flex flex-col font-sans">

  <!-- BARRA DE NAVEGACIÓN Y ROLES -->
  <header class="bg-[#241c18] border-b border-[#3d2f27] px-6 py-4 flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center gap-3">
      <div class="bg-amber-600 p-2.5 rounded-xl text-white shadow-lg shadow-amber-600/30">
        <i data-lucide="utensils-crossed" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="font-bold text-xl tracking-wide text-amber-100">Sistema POS</h1>
        <p class="text-xs text-amber-400/80">Servidor Python Activo</p>
      </div>
    </div>

    <!-- SELECTOR DE ROL -->
    <div class="flex bg-[#181412] p-1.5 rounded-xl border border-[#3d2f27] gap-1">
      <button onclick="cambiarRol('mesero')" id="btn-mesero" class="px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition bg-amber-600 text-white shadow">
        <i data-lucide="clipboard-list" class="w-4 h-4"></i> Mesero
      </button>
      <button onclick="cambiarRol('cocina')" id="btn-cocina" class="px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition text-stone-400 hover:text-white">
        <i data-lucide="flame" class="w-4 h-4"></i> Cocina
      </button>
      <button onclick="cambiarRol('caja')" id="btn-caja" class="px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition text-stone-400 hover:text-white">
        <i data-lucide="receipt" class="w-4 h-4"></i> Caja & Cobro
      </button>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
    
    <!-- VISTA 1: MESERO (MAPA DE MESAS Y COMANDA) -->
    <section id="vista-mesero" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Mapa de Mesas -->
      <div class="lg:col-span-2 space-y-4">
        <h2 class="text-lg font-bold text-amber-200/90 flex items-center gap-2">
          <i data-lucide="layout-grid" class="w-5 h-5 text-amber-500"></i> Control de Mesas
        </h2>
        <div id="grid-mesas" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
          <!-- Se cargan dinámicamente -->
        </div>
      </div>

      <!-- Panel de Comanda Activa -->
      <div class="bg-[#241c18] border border-[#3d2f27] rounded-2xl p-5 flex flex-col h-[650px] shadow-xl">
        <div class="border-b border-[#3d2f27] pb-3 mb-3 flex justify-between items-center">
          <div>
            <h3 class="font-bold text-lg text-amber-100" id="comanda-titulo">Selecciona una Mesa</h3>
            <p class="text-xs text-stone-400" id="comanda-subtitulo">Ninguna mesa activa</p>
          </div>
          <span id="badge-estado" class="text-xs px-2.5 py-1 rounded-full bg-stone-800 text-stone-300 font-medium">Inactiva</span>
        </div>

        <!-- Lista de Productos en la Comanda -->
        <div id="items-comanda" class="flex-1 overflow-y-auto space-y-2 pr-1">
          <p class="text-stone-500 text-center text-sm py-20">Selecciona productos del menú para armar el pedido</p>
        </div>

        <!-- Catálogo de Productos para Agregar -->
        <div class="border-t border-[#3d2f27] pt-3 mt-2">
          <h4 class="text-xs font-semibold text-stone-400 mb-2 uppercase tracking-wider">Menú Disponible</h4>
          <div id="catalogo-mini" class="grid grid-cols-2 gap-2 max-h-40 overflow-y-auto pr-1">
            <!-- Productos desde API -->
          </div>
        </div>

        <button onclick="enviarComandaCocina()" id="btn-enviar-comanda" disabled class="mt-4 w-full py-3 bg-amber-600 hover:bg-amber-500 disabled:opacity-40 disabled:hover:bg-amber-600 text-white font-bold rounded-xl shadow-lg transition flex justify-center items-center gap-2">
          <i data-lucide="send" class="w-4 h-4"></i> Mandar a Cocina
        </button>
      </div>
    </section>

    <!-- VISTA 2: COCINA (KDS TIEMPO REAL) -->
    <section id="vista-cocina" class="hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-amber-200/90 flex items-center gap-2">
          <i data-lucide="flame" class="w-5 h-5 text-orange-500"></i> Comandas en Preparación
        </h2>
        <span class="text-xs bg-orange-950/60 border border-orange-700/50 text-orange-300 px-3 py-1 rounded-full animate-pulse flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-orange-400"></span> WebSocket Activo
        </span>
      </div>
      <div id="grid-cocina" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Tarjetas de órdenes en vivo -->
      </div>
    </section>

    <!-- VISTA 3: CAJA Y COBRO -->
    <section id="vista-caja" class="hidden space-y-4">
      <h2 class="text-lg font-bold text-amber-200/90 flex items-center gap-2">
        <i data-lucide="receipt" class="w-5 h-5 text-amber-500"></i> Módulo de Cobro y Facturación
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div id="caja-mesas-lista" class="space-y-3">
          <!-- Mesas con cuenta abierta -->
        </div>
        <div id="caja-detalle" class="md:col-span-2 bg-[#241c18] border border-[#3d2f27] rounded-2xl p-6 hidden">
          <!-- Detalle de cuenta calculada e impresión -->
        </div>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
